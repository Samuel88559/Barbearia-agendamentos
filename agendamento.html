<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    
</head>
<body>

    <section class="contact-form">
        <div class="container">
            <h2>Agendamento</h2>
            <div class="form">
                <div class="item-form">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome">
                </div>

                <div class="item-form">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone">
                </div>

                <div class="item-form">
                    <label for="dia">Dia</label>
                    <input type="text" id="dia">
                </div>   

                <div class="item-form">
                    <label for="hora">Hora</label>
                    <input type="text" id="hora">
                </div>

                <div class="item-form">
                    <label for="cortes">Cortes</label>
                        <select id="cortes">
                            <option value="">Selecione um corte</option>
                            <option>Degradê</option>
                            <option>Social</option>
                            <option>Infantil</option>
                            <option>Barba</option>
                            <option>Pezinho</option>
                            <option>Combo (Cabelo + Barba)</option>
                            <option>Pigmentação</option>
                        </select>
                </div>        

                <div class="form-buttons">
                    <button class="btn">Próximo</button>
                </div>
            </div>
        </div>

   
    </section>
    
</body>
</html>
