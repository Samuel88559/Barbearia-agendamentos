<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    
</head>
<body>

    <section class="contact-form">
        <div class="container">
            <h2>Agendamento</h2>
            <div class="form">
                <div class="item-form">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome">
                </div>

                <div class="item-form">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone">
                </div>

                <div class="item-form">
                    <label for="dia">Dia</label>
                    <input type="text" id="dia">
                </div>   

                <div class="item-form">
                    <label for="hora">Hora</label>
                    <select id ="hora">
                        <option value="">selecione um horário</option>
                        <option>7:00 - 7:50</option>
                        <option>7:50 - 8:40</option>
                        <option>8:40 - 9:30</option>
                        <option>9:30 - 10:20</option>
                        <option>10:20 - 11:10</option>
                        <option>11:10 - 12:00</option>
                        <option>13:00 - 13:50</option>
                        <option>13:50 - 14:40</option>
                        <option>14:40 - 15:30</option>
                        <option>15:30 - 16:20</option>
                        <option>16:20 - 17:10</option>
                        <option>17:10 - 18:00</option>
                        <option> 18:00 - 18:50</option>
                    </select>
                </div>

                <div class="item-form">
                    <label for="cortes">Cortes</label>
                        <select id="cortes">
                            <option value="">Selecione um corte</option>
                            <option>Degradê</option>
                            <option>Social</option>
                            <option>Infantil</option>
                            <option>Barba</option>
                            <option>Pezinho</option>
                            <option>Combo (Cabelo + Barba)</option>
                            <option>Pigmentação</option>
                        </select>
                </div>        

                <div class="form-buttons">
                    <button class="btn">Próximo</button>
                </div>
            </div>
        </div>

   
    </section>
    
</body>
</html>
